spring:
  main:
    # Virtual threads (below) are always daemon threads, so without this the
    # JVM would exit once nothing non-daemon was left running. The web server
    # now keeps it alive anyway; this keeps the scheduled passes running if the
    # server is ever removed.
    keep-alive: true
  application:
    name: FitFetch
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${APP_POSTGRES_USER}
    password: ${APP_POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: "scheduled-task-"
  threads:
    virtual:
      enabled: true
server:
  # Serves only the actuator endpoints below; the app has no HTTP API of its
  # own. Prometheus scrapes /actuator/prometheus on this port.
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Prometheus can compute latency percentiles for
      # calls to Greenhouse, Google and Ollama. Bracketed so the dots stay part
      # of the metric name.
      percentiles-histogram:
        "[http.client.requests]": true

app:
  # Resource paths need the classpath: prefix. In a web application a bare path
  # resolves against the servlet context, where these files are not, and the
  # app fails to start.
  slug-ids: classpath:slugs.json
  http:
    # Applied to every outbound call. The JDK client has no timeouts by
    # default, so without these one hung connection stalls a run indefinitely.
    # The read timeout covers the whole exchange, body included, so it also
    # caps how long a large Greenhouse board may take to download.
    connect-timeout: PT2S
    read-timeout: PT10S
  fetch:
    enable: true
    schedule: ${FETCH_CRON_SCHEDULE}
    read-slugs-list-in-parallel: false
    # Per-ATS fetch limits. Every ATS gets the defaults unless it has an entry
    # under ats, which need only set what differs.
    limits:
      defaults:
        # Requests are spaced evenly: 1 per second is one every 1000 ms. A board
        # that pages its results costs a request per page.
        requests-per-second: 1
        # Slugs fetched at once. Lets slow responses overlap so the rate above
        # is actually reached; beyond that, extra slugs just queue for it.
        max-concurrent: 3
        # A 429 pauses every request to that ATS: for as long as its Retry-After
        # asks, or else for a backoff that starts here and doubles with each 429
        # in a row, up to max-backoff.
        initial-backoff: PT5S
        max-backoff: PT5M
        # The longest a request waits for its turn. A pause longer than this ends
        # that ATS's fetch cycle early, keeping what was fetched, instead of
        # holding up the whole run.
        max-wait: PT2M
      # An override, keyed by ATS name:
      # ats:
      #   greenhouse:
      #     requests-per-second: 5
  normalize:
    # Off until the location pass is writing job_locations: normalization only
    # takes jobs located within the radius, so until then it finds nothing.
    enable: false
    schedule: "0 0 * * * *"
    # Jobs per run. Each is one model call over a whole description, far slower
    # than a location label.
    page-size: 5
    # Only jobs with a location this close to app.location.default-origin are
    # normalized; the rest are marked OUT_OF_RANGE once and never sent to the
    # model. After widening this, requeue them (see NormalizeStatus.OUT_OF_RANGE).
    radius-miles: 50
    llm:
      base-url: ${OLLAMA_BASE_URL}
      # Its own setting so a larger model can read descriptions while the
      # location labels keep a small one; the same model unless set.
      model: ${OLLAMA_NORMALIZE_MODEL:${OLLAMA_MODEL}}
      read-timeout: PT3M
      # Must hold the instructions, the longest description and the answer.
      # Ollama's default is far smaller and truncates silently; a prompt that
      # fills the window is detected and the job marked FAILED.
      context-length: 8192
  location:
    # On, but in warm-up only (below): with geocoding on, this fills the
    # interpretation and geocode caches and nothing else. The pass is a no-op
    # while disabled.
    enable: true
    # Warm-up: resolve labels into the interpretation and geocode caches
    # without writing job_locations or changing any job's status, so model
    # answers and geocode queries can be checked first. Needs enable: true.
    # Switch it off to start writing; waiting jobs resolve from the caches.
    warm-caches-only: false
    schedule: "0 */5 * * * *"
    # One page per run: a backlog clears steadily instead of a single invocation
    # holding the model and the geocoding budget for as long as it takes.
    page-size: ${LOCATION_PAGE_SIZE}
    table: classpath:location_table.json
    # Used verbatim by every resolution that redirects here. A full street
    # address geocodes to distance zero, so no radius setting can exclude a row
    # that was redirected on purpose; a city name would land arbitrarily far off.
    default-origin: "3001 NE 130th St, Seattle, WA 98125"
    # Enables rules 6b and 7: remote-in-this-state means remote where you are,
    # not at the state centroid, which for Washington sits near Ellensburg.
    home-state: WA
    # One real posting enumerates remote eligibility across fifteen states; the
    # cap stops a pathological label from filling job_locations.
    max-locations-per-job: 10
    llm:
      base-url: ${OLLAMA_BASE_URL}
      model: ${OLLAMA_MODEL}
      # Longer than app.http.read-timeout: a local model can take a while to
      # answer, above all on the first call after it loads.
      read-timeout: PT1M
    geocoding:
      # Cache-only while false: the pass runs and resolves what is already
      # known, spending nothing and writing no negative entries.
      enabled: true
      api-key: ${GOOGLE_GEO_API_KEY:}
      coordinate-ttl: P30D
    cache:
      # Read statistics drive eviction, so every cache read implies a write.
      # Coarsening to a day cuts that by orders of magnitude and leaves
      # eviction ordering perfectly usable.
      last-hit-granularity: P1D
