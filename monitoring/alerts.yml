# Prometheus alerting rules for FitFetch. Load with rule_files in
# prometheus.yml. Names follow Micrometer's Prometheus mapping: counters gain
# _total (fetching.success.count -> fetching_success_count_total) and timers a
# unit suffix (location.geocode.request -> location_geocode_request_seconds_count).
#
# The last-success gauges are registered even when a pass is disabled and then
# never move, so silence a pass's staleness alert while its enable flag is
# false: FetchStale, LocationPassStale, NormalizePassStale, EmbeddingPassStale
# and MatchPassStale, against app.fetch.enable, app.location.enable,
# app.normalize.enable, app.embedding.enable and app.match.enable.
groups:
  - name: fitfetch
    rules:
      # --- Process ---

      # Assumes the scrape job is named fitfetch; up carries no application tag.
      - alert: FitFetchDown
        expr: up{job="fitfetch"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: FitFetch has not been scraped for 5 minutes

      # The last-success gauges start at startup, so a crash loop keeps every
      # staleness alert below from firing.
      - alert: FitFetchRestartLoop
        expr: changes(process_start_time_seconds{application="FitFetch"}[1h]) > 2
        labels:
          severity: page
        annotations:
          summary: FitFetch restarted {{ $value }} times in the last hour

      # --- Location pass (runs every 5 minutes) ---

      # Catch-all for any stop reason: model down, database error, quota.
      - alert: LocationPassStale
        expr: time() - location_pass_last_success_seconds{application="FitFetch"} > 30 * 60
        labels:
          severity: page
        annotations:
          summary: The location pass has not succeeded in over 30 minutes
          description: See location_pass_stopped_count_total by reason for why.

      # A denied key or disabled billing; retrying cannot fix it.
      - alert: GeocodingRejected
        expr: increase(location_pass_stopped_count_total{application="FitFetch", reason="geocoding_fatal"}[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: Google rejected geocoding requests; check the API key and billing

      - alert: GeocodingQuotaExhausted
        expr: increase(location_geocode_request_seconds_count{application="FitFetch", status=~"over_query_limit|over_daily_limit"}[30m]) > 0
        labels:
          severity: warn
        annotations:
          summary: The Geocoding API quota is exhausted

      # The timer's count is what Google bills for. Set the threshold to the
      # daily budget.
      - alert: GeocodingSpendHigh
        expr: sum(increase(location_geocode_request_seconds_count{application="FitFetch"}[1d])) > 1000
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} geocoding requests in the last day"

      # Any truncation means context-length or the prompt needs changing.
      - alert: LocationModelTruncating
        expr: increase(location_llm_extraction_failure_count_total{application="FitFetch", reason="truncated"}[1h]) > 0
        labels:
          severity: ticket
        annotations:
          summary: The location model truncated its answers

      # Leaves out no_locations, a valid answer, and transport, which
      # LocationPassStale covers.
      - alert: LocationModelBadOutput
        expr: sum(increase(location_llm_extraction_failure_count_total{application="FitFetch", reason=~"unparseable_json|empty_body"}[1h])) > 10
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} unusable location model answers in the last hour"

      # No smaller than a day ago: fetching adds jobs faster than the pass clears
      # them. The for clause rides out the gauge reading 0 before the first pass
      # after a restart.
      - alert: LocationBacklogNotDraining
        expr: |
          location_jobs_backlog{application="FitFetch", status="pending"} > 0
            and location_jobs_backlog{application="FitFetch", status="pending"}
              >= location_jobs_backlog{application="FitFetch", status="pending"} offset 1d
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs pending location, no fewer than a day ago"

      # Labels whose locations leave out a word of the label (coverage) or name
      # text the label does not contain (verbatim). The WARN log names them. 5%
      # is a starting guess; set it above the rate seen in the first few days.
      # The second clause keeps a quiet day's handful of labels from firing it.
      - alert: LocationLabelAuditFailing
        expr: |
          sum by (check, tier) (increase(location_labels_audited_count_total{application="FitFetch", result="fail"}[1d]))
            / sum by (check, tier) (increase(location_labels_audited_count_total{application="FitFetch"}[1d]))
            > 0.05
          and sum by (check, tier) (increase(location_labels_audited_count_total{application="FitFetch"}[1d])) >= 20
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of {{ $labels.tier }} labels failed the {{ $labels.check }} audit in the last day"

      # --- Fetch pass (per ATS) ---

      # One schedule interval plus slack; 26h assumes FETCH_CRON_SCHEDULE is daily.
      - alert: FetchStale
        expr: time() - fetching_last_success_seconds{application="FitFetch"} > 26 * 3600
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.ats }} has not been fetched successfully in over 26 hours"

      # A 429 pause longer than max-wait ended the cycle early and skipped boards.
      - alert: FetchCycleCutShort
        expr: increase(fetching_stopped_count_total{application="FitFetch"}[1d]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.ats }} fetch cycles ended early after throttling"

      # Zero is recorded each cycle, so the series exists and this can fire.
      - alert: FetchSavedNothing
        expr: sum by (ats) (increase(fetching_jobs_saved_count_total{application="FitFetch"}[2d])) == 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.ats }} saved no new jobs in 2 days"

      # The name regex copes with a counter that has not been created yet. Dead
      # slugs give a nonzero baseline; measure it and set the threshold above it.
      - alert: FetchErrorRateHigh
        expr: |
          sum by (ats) (increase({__name__=~"fetching_(error|null_response)_count_total", application="FitFetch"}[1d]))
            / sum by (ats) (increase({__name__=~"fetching_(success|error|null_response)_count_total", application="FitFetch"}[1d]))
            > 0.10
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | humanizePercentage }} of {{ $labels.ats }} slug fetches failed in the last day"

      # A jump in invalid jobs usually means the ATS changed its payload.
      - alert: FetchInvalidJobsSpike
        expr: |
          sum by (ats) (increase(fetching_jobs_count_total{application="FitFetch", result="invalid"}[1d]))
            / sum by (ats) (increase(fetching_jobs_count_total{application="FitFetch"}[1d]))
            > 0.05
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of jobs from {{ $labels.ats }} were invalid in the last day"

      # --- Normalize pass (runs every 10 minutes) ---

      # Catch-all for any stop reason: model down, origin unavailable, database.
      - alert: NormalizePassStale
        expr: time() - normalize_pass_last_success_seconds{application="FitFetch"} > 60 * 60
        labels:
          severity: page
        annotations:
          summary: The normalization pass has not succeeded in over an hour
          description: See normalize_pass_stopped_count_total by reason for why.

      # Sampling is deterministic, so a FAILED job gives the same answer on every
      # retry and is never tried again. They accumulate silently; these are what
      # to look at after changing the prompt.
      - alert: NormalizeFailuresClimbing
        expr: increase(normalize_jobs_count_total{application="FitFetch", result="failed"}[1h]) > 5
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs failed normalization in the last hour"
          description: See normalize_jobs_failed_count_total by reason.

      # prompt_too_long is refused before the call, cut_off means the answer ran
      # past the window. Either needs context-length or the prompt changing.
      - alert: NormalizeModelTruncating
        expr: |
          sum(increase(normalize_extraction_failure_count_total{application="FitFetch",
              reason=~"prompt_too_long|cut_off"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: The normalization model ran out of context

      # Leaves out transport, which NormalizePassStale covers.
      - alert: NormalizeModelBadOutput
        expr: |
          sum(increase(normalize_extraction_failure_count_total{application="FitFetch",
              reason=~"unparseable_json|empty_body|no_seniority|no_signals"}[1h])) > 10
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} unusable normalization answers in the last hour"

      # A job that has stopped the run STRIKE_LIMIT times is skipped but stays
      # PENDING, so it never leaves the backlog and nothing else would show it.
      - alert: NormalizeJobsSetAside
        expr: increase(normalize_jobs_count_total{application="FitFetch", result="set_aside"}[6h]) > 0
        labels:
          severity: warn
        annotations:
          summary: Jobs are being set aside after repeated failures and will stay pending

      - alert: NormalizeBacklogNotDraining
        expr: |
          normalize_jobs_backlog{application="FitFetch", status="pending"} > 0
            and normalize_jobs_backlog{application="FitFetch", status="pending"}
              >= normalize_jobs_backlog{application="FitFetch", status="pending"} offset 1d
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs pending normalization, no fewer than a day ago"

      # --- Posting age ---

      # Aging out is a trickle once the first sweep is done. A sustained spike
      # means app.normalize.max-age-days is tighter than the pipeline is fast,
      # and jobs are crossing it while they queue rather than on the board.
      - alert: NormalizeAgingOutJobs
        expr: increase(normalize_jobs_count_total{application="FitFetch", result="too_old"}[1d]) > 50
        labels:
          severity: warn
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs aged out in the last day"
          description: Compare max-age-days with how long the normalize backlog takes to clear.

      # Greenhouse dates every posting, so this stays at zero. Nonzero means a
      # board changed its payload and those jobs are aged from when we fetched
      # them, which quietly defeats the age limit.
      - alert: JobsMissingPostingDate
        expr: increase(fetching_jobs_missing_posted_count_total{application="FitFetch"}[1d]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.ats }} published no posting date for {{ $value | printf \"%.0f\" }} jobs"

      # --- Embedding pass (runs every 10 minutes) ---

      - alert: EmbeddingPassStale
        expr: time() - embedding_pass_last_success_seconds{application="FitFetch"} > 60 * 60
        labels:
          severity: page
        annotations:
          summary: The embedding pass has not succeeded in over an hour
          description: See embedding_pass_stopped_count_total by reason for why.

      # --- Match pass (runs every 10 minutes) ---

      - alert: MatchPassStale
        expr: time() - match_pass_last_success_seconds{application="FitFetch"} > 60 * 60
        labels:
          severity: page
        annotations:
          summary: The matching pass has not succeeded in over an hour
          description: See match_pass_stopped_count_total by reason for why.

      # Enabled with no profile scores nothing at all, and without this it looks
      # exactly like a pass with nothing left to do. MatchPassStale fires too;
      # this one says which fix is needed.
      - alert: MatchHasNoProfile
        expr: increase(match_pass_stopped_count_total{application="FitFetch", reason="no_profile"}[1h]) > 0
        labels:
          severity: ticket
        annotations:
          summary: Matching is enabled but no candidate profile is loaded
          description: Set APP_PROFILE_PATH to a valid profile.yaml.
