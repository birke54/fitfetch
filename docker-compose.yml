services:
  fitfetch-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER} -d ${DB_NAME:-fitfetch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/birke54/fitfetch:latest
    depends_on:
      fitfetch-db:
        condition: service_healthy
    environment:
      # application.yaml builds the JDBC URL from these
      DB_HOST: ${DB_NAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      APP_DB_USER: ${APP_POSTGRES_USER}
      APP_DB_PASSWORD: ${APP_POSTGRES_PASSWORD}
      # The candidate profile, read from the mounted directory below. Without
      # a profile.yaml there, the app runs with matching off.
      APP_PROFILE_PATH: /app/profile/profile.yaml
      GOOGLE_GEO_API_KEY: ${GOOGLE_GEO_API_KEY}
      # Ollama: see .env.example for the per-pass models.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_NORMALIZE_MODEL: ${OLLAMA_NORMALIZE_MODEL:-${OLLAMA_MODEL}}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      APP_NORMALIZE_LLM_THINK: ${APP_NORMALIZE_LLM_THINK:-}
      # Each pass: whether it runs, how often, and how much per run. Every
      # pass is off unless its variable says otherwise. Change these here or
      # in .env; none of them needs a new image.
      FETCH_ENABLE: ${FETCH_ENABLE:-false}
      FETCH_CRON_SCHEDULE: ${FETCH_CRON_SCHEDULE}
      LOCATION_ENABLE: ${LOCATION_ENABLE:-false}
      LOCATION_SCHEDULE: ${LOCATION_SCHEDULE:-0 */5 * * * *}
      LOCATION_PAGE_SIZE: ${LOCATION_PAGE_SIZE}
      LOCATION_WARM_CACHES_ONLY: ${LOCATION_WARM_CACHES_ONLY:-false}
      NORMALIZE_ENABLE: ${NORMALIZE_ENABLE:-false}
      NORMALIZE_SCHEDULE: ${NORMALIZE_SCHEDULE:-0 */10 * * * *}
      NORMALIZE_PAGE_SIZE: ${NORMALIZE_PAGE_SIZE:-2}
      EMBEDDING_ENABLE: ${EMBEDDING_ENABLE:-false}
      EMBEDDING_SCHEDULE: ${EMBEDDING_SCHEDULE:-0 */10 * * * *}
      EMBEDDING_PAGE_SIZE: ${EMBEDDING_PAGE_SIZE:-20}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      MATCH_ENABLE: ${MATCH_ENABLE:-false}
      MATCH_SCHEDULE: ${MATCH_SCHEDULE:-0 */10 * * * *}
      MATCH_PAGE_SIZE: ${MATCH_PAGE_SIZE:-100}
    volumes:
      # A directory rather than the file: mounting a file that does not exist
      # makes Docker create a directory in its place.
      - ./profile:/app/profile:ro
    restart: unless-stopped
    # Serves /actuator/health and /actuator/prometheus for scraping.
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
