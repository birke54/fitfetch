services:
  fitfetch-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER} -d ${DB_NAME:-fitfetch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/birke54/fitfetch:latest
    depends_on:
      fitfetch-db:
        condition: service_healthy
    environment:
      # application.yaml builds the JDBC URL from these
      DB_HOST: ${DB_NAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      APP_DB_USER: ${APP_POSTGRES_USER}
      APP_DB_PASSWORD: ${APP_POSTGRES_PASSWORD}
      # The candidate profile, read from the mounted directory below. Without
      # a profile.yaml there, the app runs with matching off.
      APP_PROFILE_PATH: /app/profile/profile.yaml
    volumes:
      # A directory rather than the file: mounting a file that does not exist
      # makes Docker create a directory in its place.
      - ./profile:/app/profile:ro
    restart: unless-stopped
    # Serves /actuator/health and /actuator/prometheus for scraping.
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
