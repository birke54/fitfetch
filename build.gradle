plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'FitFetch'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// Reads the hand-written candidate profile (profile/profile.yaml).
	implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Serves the actuator endpoints (health, prometheus) over HTTP. The app has
	// no controllers of its own; without a web server the metrics could not be
	// scraped.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Database: PostgreSQL driver + Flyway (runs src/main/resources/db/migration on startup).
	// Spring Boot 4 moved Flyway's autoconfiguration out of the monolithic
	// autoconfigure jar into this starter; flyway-core alone no longer
	// triggers migrations on startup (silently does nothing).
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// The context test boots Flyway and JPA against a real Postgres. The
	// migrations are Postgres-specific -- JSONB columns, sequences -- so an
	// in-memory stand-in would either fail to apply them or verify a schema
	// the application never runs on.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

// Spring Boot 4.1 does not manage the Testcontainers versions, so the BOM is
// imported here to keep junit-jupiter and postgresql on one version.
dependencyManagement {
	imports {
		mavenBom 'org.testcontainers:testcontainers-bom:1.21.3'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
